# Base PostgreSQL locale : docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: creancio
      POSTGRES_PASSWORD: motdepasse
      POSTGRES_DB: creancio
    ports:
      - "5432:5432"
    volumes:
      - creancio-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creancio"]
      interval: 5s
      retries: 10
  # Boîte de réception locale pour les e-mails de développement : docker compose up -d mailpit
  # (EMAIL_DRIVER="mailpit" ; lecture sur http://localhost:8025). Rien n'est envoyé sur Internet.
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
volumes:
  creancio-data:
